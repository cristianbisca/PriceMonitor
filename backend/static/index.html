<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Monitor</title>
    
    <!-- PWA / Home Screen Shortcut -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Price Monitor">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icon-16.png">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-purple: #a855f7;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 30px;
        }
        header h1 { font-size: 1.8rem; font-weight: 700; }
        header h1 span { color: var(--accent-blue); }
        .header-actions { display: flex; gap: 12px; align-items: center; }

        /* Buttons */
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 0.9rem; font-weight: 600; transition: all 0.2s; display: inline-flex;
            align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: var(--accent-red); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
        .btn-secondary:hover { background: #475569; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        /* Stats Cards */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-card); border-radius: 12px; padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }
        .stat-card .label { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px; }
        .stat-card .value { font-size: 2rem; font-weight: 700; }
        .stat-card .sub { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary); border-radius: 16px; padding: 32px;
            width: 90%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal h2 { margin-bottom: 24px; font-size: 1.3rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-primary); color: var(--text-primary); font-size: 0.95rem;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-blue); }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }

        /* Products Table */
        .products-section { background: var(--bg-card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px; border-bottom: 1px solid var(--border-color);
        }
        .section-header h2 { font-size: 1.2rem; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px 24px; color: var(--text-secondary); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(0,0,0,0.2); }
        td { padding: 16px 24px; border-top: 1px solid var(--border-color); vertical-align: middle; }
        tr:hover { background: var(--bg-hover); }

        .product-name { font-weight: 600; cursor: pointer; color: var(--accent-blue); }
        .product-name:hover { text-decoration: underline; }
        .product-url { color: var(--text-muted); font-size: 0.85rem; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .price-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        .price-current { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
        .price-min { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }

        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-active { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
        .status-inactive { background: rgba(100, 116, 139, 0.2); color: var(--text-muted); }

        .actions-cell { display: flex; gap: 8px; }

        /* Detail View */
        .detail-view { display: none; }
        .detail-view.active { display: block; }
        .list-view.hidden { display: none; }

        .detail-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 30px;
        }
        .detail-info h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .detail-info a { color: var(--accent-blue); text-decoration: none; word-break: break-all; }

        .chart-container {
            background: var(--bg-card); border-radius: 12px; padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border-color); margin-bottom: 30px;
        }
        .chart-wrapper { position: relative; height: 400px; }

        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px; margin-bottom: 30px;
        }
        .stat-item {
            background: var(--bg-card); border-radius: 12px; padding: 20px;
            text-align: center; border: 1px solid var(--border-color);
        }
        .stat-item .stat-label { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px; }
        .stat-item .stat-value { font-size: 1.4rem; font-weight: 700; }

        /* Price History Table */
        .history-table th:nth-child(2), .history-table td:nth-child(2) { text-align: right; }
        .history-table th:nth-child(3), .history-table td:nth-child(3) { text-align: center; }
        .min-badge { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            padding: 14px 20px; border-radius: 8px; color: white; font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4); animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }
        .toast-success { background: var(--accent-green); }
        .toast-error { background: var(--accent-red); }
        .toast-info { background: var(--accent-blue); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Loading */
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border-color); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-secondary); }

        /* Responsive */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 16px; align-items: stretch; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            table { font-size: 0.85rem; }
            th, td { padding: 12px 16px; }
            .actions-cell { flex-direction: column; }
        }

        /* Toggle Switch */
        .toggle { position: relative; width: 48px; height: 26px; display: inline-block; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-hover); border-radius: 26px; transition: 0.3s;
        }
        .toggle-slider:before {
            content: ''; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background: white; border-radius: 50%; transition: 0.3s;
        }
        .toggle input:checked + .toggle-slider { background: var(--accent-green); }
        .toggle input:checked + .toggle-slider:before { transform: translateX(22px); }

        /* Health indicator */
        .health-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .health-ok { background: var(--accent-green); }
        .health-err { background: var(--accent-red); }

        /* ===== Login Overlay ===== */
        .login-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.active {
            display: flex;
        }

        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 36px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-logo {
            margin-bottom: 32px;
        }

        .login-logo-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        .login-logo h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-logo h1 span {
            color: var(--accent-blue);
        }

        .login-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 8px;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .login-form input[type="text"]:focus,
        .login-form input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .login-form .btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            justify-content: center;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--accent-red);
            font-size: 0.85rem;
            display: none;
        }

        @media (max-width: 480px) {
            .login-box {
                margin: 16px;
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="login-logo">
                <span class="login-logo-icon">📊</span>
                <h1>Price <span>Monitor</span></h1>
                <p class="login-subtitle">Authentication Required</p>
            </div>
            <form id="loginForm" class="login-form" onsubmit="return false;">
                <div class="login-error" id="loginError"></div>
                <input type="text" id="loginUser" placeholder="Username" autocomplete="username" required>
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <div class="container">
        <!-- Toast Container -->
        <div class="toast-container" id="toastContainer"></div>

        <!-- Header -->
        <header>
            <h1>📊 Price <span>Monitor</span></h1>
            <div class="header-actions">
                <span id="healthStatus"><span class="health-dot health-ok"></span>Online</span>
                <button class="btn btn-secondary btn-sm" onclick="checkAllPrices()">🔄 Check All Prices</button>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add Product</button>
            </div>
        </header>

        <!-- List View -->
        <div class="list-view" id="listView">
            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="label">Total Products</div>
                    <div class="value" id="totalProducts">-</div>
                    <div class="sub">being monitored</div>
                </div>
                <div class="stat-card">
                    <div class="label">Active Checks</div>
                    <div class="value" id="activeProducts">-</div>
                    <div class="sub">enabled products</div>
                </div>
                <div class="stat-card">
                    <div class="label">Total Price Checks</div>
                    <div class="value" id="totalChecks">-</div>
                    <div class="sub">checks performed</div>
                </div>
                <div class="stat-card">
                    <div class="label">Price Drops Found</div>
                    <div class="value" id="priceDrops">-</div>
                    <div class="sub">new minimums</div>
                </div>
            </div>

            <!-- Products Table -->
            <div class="products-section">
                <div class="section-header">
                    <h2>Monitored Products</h2>
                </div>
                <div id="productsTableContainer">
                    <div class="loading"><div class="spinner"></div><br>Loading products...</div>
                </div>
            </div>
        </div>

        <!-- Detail View -->
        <div class="detail-view" id="detailView">
            <button class="btn btn-secondary" onclick="showListView()" style="margin-bottom: 20px;">← Back to Products</button>

            <div class="detail-header">
                <div class="detail-info">
                    <h2 id="detailName"></h2>
                    <a id="detailUrl" href="#" target="_blank"></a>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-success btn-sm" onclick="checkCurrentProduct()">🔄 Check Now</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteCurrentProduct()">🗑 Delete</button>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="stats-row" id="detailStats"></div>

            <!-- Chart -->
            <div class="chart-container">
                <h3 style="margin-bottom: 20px;">Price History</h3>
                <div class="chart-wrapper">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>

            <!-- Price History Table -->
            <div class="products-section">
                <div class="section-header"><h2>Price History</h2></div>
                <div id="historyTableContainer"></div>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Add New Product</h2>
            <form onsubmit="addProduct(event)">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="productName" required placeholder="e.g., iPhone 15 Pro">
                </div>
                <div class="form-group">
                    <label>Product URL *</label>
                    <input type="url" id="productUrl" required placeholder="https://example.com/product">
                </div>
                <div class="form-group">
                    <label>Currency</label>
                    <select id="productCurrency">
                        <option value="RON" selected>RON - Romanian Leu</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="GBP">GBP - British Pound</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Scraper Type</label>
                    <select id="scraperType" onchange="toggleCustomSelector()">
                        <option value="auto" selected>Auto-detect</option>
                        <option value="custom">Custom CSS Selector</option>
                    </select>
                </div>
                <div class="form-group" id="customSelectorGroup" style="display: none;">
                    <label>CSS Selector for Price</label>
                    <input type="text" id="customSelector" placeholder='e.g., .price or [itemprop="price"]'>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (async function() {
            // ─── Authentication State ────────────────────────────────────────
            let authRequired = false;
            let authToken = null;

            async function checkAuthStatus() {
                try {
                    const response = await fetch('/api/auth/status');
                    const data = await response.json();
                    authRequired = data.authRequired;

                    if (authRequired) {
                        // Check for stored token
                        authToken = sessionStorage.getItem('pm_token');
                        if (authToken) {
                            // Validate the token by making a test request
                            const valid = await validateToken();
                            if (!valid) {
                                sessionStorage.removeItem('pm_token');
                                authToken = null;
                                showLoginOverlay();
                                return false;
                            }
                            hideLoginOverlay();
                            return true;
                        } else {
                            showLoginOverlay();
                            return false;
                        }
                    } else {
                        hideLoginOverlay();
                        return true;
                    }
                } catch (err) {
                    console.error('Auth check failed:', err);
                    return true; // Allow access on error to avoid lockout
                }
            }

            async function validateToken() {
                try {
                    const response = await fetch('/api/health', {
                        headers: { 'X-PM-Token': authToken }
                    });
                    return response.ok;
                } catch (err) {
                    return false;
                }
            }

            function showLoginOverlay() {
                document.getElementById('loginOverlay').classList.add('active');
            }

            function hideLoginOverlay() {
                document.getElementById('loginOverlay').classList.remove('active');
            }

            async function handleLogin(e) {
                if (e) e.preventDefault();
                const user = document.getElementById('loginUser').value;
                const password = document.getElementById('loginPassword').value;
                const errorEl = document.getElementById('loginError');

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        authToken = data.token;
                        sessionStorage.setItem('pm_token', authToken);
                        errorEl.style.display = 'none';
                        hideLoginOverlay();
                        // Initialize the app after login
                        initApp();
                    } else {
                        errorEl.textContent = data.error || 'Login failed';
                        errorEl.style.display = 'block';
                    }
                } catch (err) {
                    errorEl.textContent = 'Connection error. Please try again.';
                    errorEl.style.display = 'block';
                }
            }

            // Attach login form handler
            document.getElementById('loginForm').addEventListener('submit', handleLogin);

            // ─── API Helper with Auth ────────────────────────────────────────
            window.api = async function(method, path, body) {
                const opts = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) opts.body = JSON.stringify(body);
                if (authToken) {
                    opts.headers['X-PM-Token'] = authToken;
                }
                const res = await fetch(path, opts);
                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(text);
                }
                return res.status === 204 ? null : await res.json();
            };

            // ─── Wait for auth before proceeding ─────────────────────────────
            const authOk = await checkAuthStatus();
            if (!authOk) {
                // Wait for user to login
                return;
            }

            // Auth passed - initialize the app
            initApp();
        })();

        // ─── App Initialization (called after auth) ─────────────────────────
        function initApp() {
            let products = [];
            let currentProductId = null;
            let priceChartInstance = null;

            // Get the authToken from sessionStorage (set by auth module)
            const authToken = sessionStorage.getItem('pm_token');

            function showToast(message, type) {
                type = type || 'info';
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast toast-' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }

            async function loadProducts() {
                try {
                    products = await window.api('GET', '/api/products');
                    renderProducts();
                    updateStats();
                } catch (err) {
                    console.error(err);
                    showToast('Failed to load products', 'error');
                }
            }

            function updateStats() {
                const total = products.length;
                const active = products.filter(p => p.enabled).length;
                const checks = products.reduce((sum, p) => sum + (p.price_count || 0), 0);
                const drops = products.reduce((sum, p) => sum + (p.min_price && p.current_price === p.min_price ? 1 : 0), 0);
                document.getElementById('totalProducts').textContent = total;
                document.getElementById('activeProducts').textContent = active;
                document.getElementById('totalChecks').textContent = checks;
                document.getElementById('priceDrops').textContent = drops;
            }

            function renderProducts() {
                const container = document.getElementById('productsTableContainer');
                if (products.length === 0) {
                    container.innerHTML = '<div class="empty-state"><h3>No products being monitored</h3><p>Add a product to start tracking price changes</p></div>';
                    return;
                }
                let html = '<table><thead><tr><th>Product</th><th>Status</th><th>Current Price</th><th>Min Price</th><th>Avg Price</th><th>Checks</th><th>Actions</th></tr></thead><tbody>';
                products.forEach(p => {
                    html += '<tr>';
                    html += '<td><div class="product-name" onclick="showProductDetail(' + p.id + ')">' + escapeHtml(p.name) + '</div><div class="product-url" title="' + escapeHtml(p.url) + '">' + escapeHtml(p.url) + '</div></td>';
                    html += '<td><span class="status-badge ' + (p.enabled ? 'status-active' : 'status-inactive') + '">' + (p.enabled ? 'Active' : 'Paused') + '</span></td>';
                    html += '<td>' + (p.current_price ? '<span class="price-badge price-current">' + formatPrice(p.current_price, p.currency) + '</span>' : '<span style="color:var(--text-muted)">No data</span>') + '</td>';
                    html += '<td>' + (p.min_price ? '<span class="price-badge price-min">' + formatPrice(p.min_price, p.currency) + '</span>' : '-') + '</td>';
                    html += '<td>' + (p.avg_price ? formatPrice(p.avg_price, p.currency) : '-') + '</td>';
                    html += '<td>' + (p.price_count || 0) + '</td>';
                    html += '<td class="actions-cell"><button class="btn btn-success btn-sm" onclick="checkProduct(' + p.id + ')">🔄</button><label class="toggle" title="' + (p.enabled ? 'Disable' : 'Enable') + '"><input type="checkbox" ' + (p.enabled ? 'checked' : '') + ' onchange="toggleProduct(' + p.id + ', this.checked)"><span class="toggle-slider"></span></label><button class="btn btn-danger btn-sm" onclick="deleteProduct(' + p.id + ')">🗑</button></td>';
                    html += '</tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            }

            function formatPrice(price, currency) {
                currency = currency || 'RON';
                return parseFloat(price).toFixed(2) + ' ' + currency;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            window.openAddModal = function() { document.getElementById('addModal').classList.add('active'); };
            window.closeAddModal = function() { document.getElementById('addModal').classList.remove('active'); };
            window.toggleCustomSelector = function() {
                document.getElementById('customSelectorGroup').style.display = document.getElementById('scraperType').value === 'custom' ? 'block' : 'none';
            };

            window.addProduct = async function(e) {
                e.preventDefault();
                try {
                    const product = await window.api('POST', '/api/products', {
                        name: document.getElementById('productName').value,
                        url: document.getElementById('productUrl').value,
                        currency: document.getElementById('productCurrency').value,
                        scraper_type: document.getElementById('scraperType').value,
                        custom_selector: document.getElementById('customSelector').value || null,
                    });
                    showToast('Product "' + product.name + '" added successfully!', 'success');
                    closeAddModal();
                    e.target.reset();
                    loadProducts();
                } catch (err) {
                    showToast(err.message || 'Failed to add product', 'error');
                }
            };

            window.toggleProduct = async function(id, enabled) {
                try {
                    await window.api('PUT', '/api/products/' + id, { enabled });
                    showToast(enabled ? 'Product enabled' : 'Product paused', 'info');
                    loadProducts();
                } catch (err) {
                    showToast('Failed to update product', 'error');
                }
            };

            window.deleteProduct = async function(id) {
                if (!confirm('Are you sure you want to delete this product?')) return;
                try {
                    await window.api('DELETE', '/api/products/' + id);
                    showToast('Product deleted', 'success');
                    loadProducts();
                } catch (err) {
                    showToast('Failed to delete product', 'error');
                }
            };

            window.checkProduct = async function(id) {
                showToast('Checking price...', 'info');
                try {
                    const result = await window.api('POST', '/api/products/' + id + '/check');
                    if (result.success) {
                        showToast(result.is_minimum ? 'New minimum price found!' : 'Price: ' + formatPrice(result.price), 'success');
                    } else {
                        showToast(result.message || 'Could not extract price', 'error');
                    }
                    loadProducts();
                } catch (err) {
                    showToast('Failed to check price', 'error');
                }
            };

            window.checkAllPrices = async function() {
                showToast('Checking all products...', 'info');
                try {
                    const result = await window.api('POST', '/api/check-all');
                    showToast('Checked ' + result.successful + '/' + result.total + ' products', 'success');
                    loadProducts();
                } catch (err) {
                    showToast('Failed to check prices', 'error');
                }
            };

            window.showProductDetail = async function(id) {
                currentProductId = id;
                document.getElementById('listView').classList.add('hidden');
                document.getElementById('detailView').classList.add('active');
                const product = products.find(p => p.id === id);
                if (!product) return;
                document.getElementById('detailName').textContent = product.name;
                var urlEl = document.getElementById('detailUrl');
                urlEl.textContent = product.url;
                urlEl.href = product.url;
                renderDetailStats(product);
                await loadPriceHistory(id);
            };

            function renderDetailStats(p) {
                document.getElementById('detailStats').innerHTML =
                    '<div class="stat-item"><div class="stat-label">Current Price</div><div class="stat-value" style="color:var(--accent-blue)">' + (p.current_price ? formatPrice(p.current_price, p.currency) : 'N/A') + '</div></div>' +
                    '<div class="stat-item"><div class="stat-label">Min Price</div><div class="stat-value" style="color:var(--accent-green)">' + (p.min_price ? formatPrice(p.min_price, p.currency) : 'N/A') + '</div></div>' +
                    '<div class="stat-item"><div class="stat-label">Max Price</div><div class="stat-value" style="color:var(--accent-red)">' + (p.max_price ? formatPrice(p.max_price, p.currency) : 'N/A') + '</div></div>' +
                    '<div class="stat-item"><div class="stat-label">Avg Price</div><div class="stat-value">' + (p.avg_price ? formatPrice(p.avg_price, p.currency) : 'N/A') + '</div></div>' +
                    '<div class="stat-item"><div class="stat-label">Total Checks</div><div class="stat-value">' + (p.price_count || 0) + '</div></div>';
            }

            window.showListView = function() {
                document.getElementById('detailView').classList.remove('active');
                document.getElementById('listView').classList.remove('hidden');
                currentProductId = null;
                if (priceChartInstance) { priceChartInstance.destroy(); priceChartInstance = null; }
            };

            async function loadPriceHistory(id) {
                try {
                    const history = await window.api('GET', '/api/products/' + id + '/prices/reverse');
                    if (history.length === 0) {
                        document.getElementById('historyTableContainer').innerHTML = '<div class="empty-state"><h3>No price data yet</h3><p>Click "Check Now" to get the first price reading</p></div>';
                        return;
                    }
                    renderChart(history);
                    let html = '<table class="history-table"><thead><tr><th>Date</th><th>Price</th><th>Status</th></tr></thead><tbody>';
                    history.slice().reverse().forEach(entry => {
                        var date = new Date(entry.checked_at).toLocaleString('ro-RO', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                        html += '<tr><td>' + date + '</td><td><strong>' + formatPrice(entry.price, entry.currency) + '</strong></td><td>' + (entry.is_minimum ? '<span class="min-badge">MINIMUM</span>' : '-') + '</td></tr>';
                    });
                    html += '</tbody></table>';
                    document.getElementById('historyTableContainer').innerHTML = html;
                } catch (err) {
                    showToast('Failed to load price history', 'error');
                }
            }

            function renderChart(history) {
                const ctx = document.getElementById('priceChart').getContext('2d');
                if (priceChartInstance) priceChartInstance.destroy();
                const labels = history.map(e => new Date(e.checked_at));
                const minPoints = history.filter(e => e.is_minimum).map(e => ({ x: new Date(e.checked_at), y: e.price }));
                priceChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Price',
                                data: history.map((e, i) => ({ x: labels[i], y: e.price })),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 2, fill: true, tension: 0.3,
                                pointRadius: 4, pointBackgroundColor: '#3b82f6',
                            },
                            {
                                label: 'Minimum Price',
                                data: minPoints,
                                borderColor: 'transparent', backgroundColor: '#22c55e',
                                pointRadius: 10, pointStyle: 'star', pointHoverRadius: 12,
                            }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { intersect: false, mode: 'index' },
                        plugins: {
                            legend: { labels: { color: '#94a3b8', usePointStyle: true } },
                            tooltip: {
                                backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#94a3b8',
                                borderColor: '#334155', borderWidth: 1, padding: 12,
                                callbacks: { label: function(ctx) { return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(2) + ' RON'; } }
                            }
                        },
                        scales: {
                            x: { type: 'time', time: { tooltipFormat: 'dd MMM yyyy HH:mm', displayFormats: { day: 'dd MMM', hour: 'dd MMM HH:mm' } }, grid: { color: 'rgba(51, 65, 85, 0.3)' }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: 'rgba(51, 65, 85, 0.3)' }, ticks: { color: '#94a3b8', callback: function(v) { return v.toFixed(2); } } }
                        }
                    }
                });
            }

            window.checkCurrentProduct = async function() {
                if (!currentProductId) return;
                await window.checkProduct(currentProductId);
                await loadPriceHistory(currentProductId);
                const product = await window.api('GET', '/api/products/' + currentProductId);
                renderDetailStats(product);
            };

            window.deleteCurrentProduct = async function() {
                if (!currentProductId) return;
                await window.deleteProduct(currentProductId);
                window.showListView();
            };

            setInterval(loadProducts, 60000);
            loadProducts();
        }
    </script>
</body>
</html>
