# ============================================
# Price Monitor - Docker Compose (Local Dev)
# ============================================

version: '3.8'

services:
  pricemonitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-monitor
    ports:
      - "13020:3000"
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/price_monitor.db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - PRICE_CHECK_TIMES=${PRICE_CHECK_TIMES:-09:00,14:00}
      - ALTERNATE_LINK_TIMES=${ALTERNATE_LINK_TIMES:-}
      - ALTERNATE_LINKS_MAX=${ALTERNATE_LINKS_MAX:-3}
      - PORT=3000
      - HOST=0.0.0.0
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - PM_CORS_ORIGINS=${PM_CORS_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DROPBOX_REFRESH_TOKEN=${BACKUP_DROPBOX_REFRESH_TOKEN:-}
      - BACKUP_DROPBOX_APP_KEY=${BACKUP_DROPBOX_APP_KEY:-}
      - BACKUP_DROPBOX_APP_SECRET=${BACKUP_DROPBOX_APP_SECRET:-}
      - BACKUP_DROPBOX_FOLDER=${BACKUP_DROPBOX_FOLDER:-/Backup}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - RESTORE_LATEST_BACKUP=${RESTORE_LATEST_BACKUP:-false}
    volumes:
      - pricemonitor_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  pricemonitor_data:
    driver: local