# ============================================
# Price Monitor - Portainer Stack Deployment
# ============================================
# Deploy via Portainer: Stacks -> Add stack
# Name: price-monitor
# Type: Swarm (or Standalone)
# Repository: Web/Git - point to your GitHub repo
# Build: docker-stack.yml as compose file
#
# Environment variables are set directly in Portainer
# under the "Advanced" section or via env_file.
# ============================================

version: '3.8'

services:
  pricemonitor:
    image: ghcr.io/cristianbisca/price-monitor:latest
    # To rebuild from source, uncomment build context instead:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      - DATABASE_URL=sqlite:///data/price_monitor.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PRICE_CHECK_TIMES=${PRICE_CHECK_TIMES:-09:00,14:00}
      - PORT=4300
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - pricemonitor_data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4300/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  pricemonitor_data: